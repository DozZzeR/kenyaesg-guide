<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>KenyaESG Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
%%CSS%%
</style>
</head>
<body>
<div class="bar">
  <span class="brand">KenyaESG</span>
  <span class="tools">
    <span class="seg" role="group" aria-label="Language">
      <button type="button" id="lang-ru" data-lang="ru">RU</button>
      <button type="button" id="lang-en" data-lang="en">EN</button>
    </span>
    <button type="button" class="btn-ghost" id="logout" hidden></button>
  </span>
</div>

<form class="login" id="login" autocomplete="on">
  <h1 id="l-title"></h1>
  <p id="l-sub"></p>
  <label><span id="l-user"></span><input id="user" name="username" autocomplete="username" required></label>
  <label><span id="l-pass"></span><input id="pass" name="password" type="password" autocomplete="current-password" required></label>
  <label class="remember"><input id="remember" type="checkbox"><span id="l-remember"></span></label>
  <button type="submit" id="go"></button>
  <div class="err" id="err" role="alert"></div>
</form>

<div id="content" hidden></div>

<script>
const SALT = "%%SALT%%", ITER = %%ITER%%, KEY_SLOT = "kenyaesg-key";
const T = {
  ru: {title: "Путеводитель KenyaESG", sub: "Закрытый справочник по ESG и углеродному учёту в Кении. Войдите, чтобы открыть.",
       user: "Пользователь", pass: "Пароль", remember: "Запомнить на этом устройстве", go: "Войти", wait: "Проверяю…",
       bad: "Неверный пользователь или пароль.", net: "Не удалось загрузить текст. Обновите страницу.", out: "Выйти"},
  en: {title: "KenyaESG Guide", sub: "A private guide to ESG and carbon accounting in Kenya. Sign in to open it.",
       user: "Username", pass: "Password", remember: "Remember on this device", go: "Sign in", wait: "Checking…",
       bad: "Wrong username or password.", net: "Could not load the text. Reload the page.", out: "Sign out"}
};
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const store = {
  get(){ try { return localStorage.getItem(KEY_SLOT) || sessionStorage.getItem(KEY_SLOT); } catch { return null; } },
  set(v, keep){ try { (keep ? localStorage : sessionStorage).setItem(KEY_SLOT, v); } catch {} },
  clear(){ try { localStorage.removeItem(KEY_SLOT); sessionStorage.removeItem(KEY_SLOT); } catch {} }
};
let lang = (() => { try { const q = new URLSearchParams(location.search).get("lang"); return q || localStorage.getItem("kenyaesg-lang") || ((navigator.language || "").startsWith("ru") ? "ru" : "en"); } catch { return "ru"; } })();
if (!T[lang]) lang = "ru";
let key = null;
const cache = {};

function labels(){
  const t = T[lang];
  document.documentElement.lang = lang;
  $("l-title").textContent = t.title; $("l-sub").textContent = t.sub;
  $("l-user").textContent = t.user; $("l-pass").textContent = t.pass;
  $("l-remember").textContent = t.remember; $("go").textContent = t.go; $("logout").textContent = t.out;
  for (const l of ["ru", "en"]) $("lang-" + l).setAttribute("aria-pressed", String(l === lang));
}

async function derive(user, pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(user + "\n" + pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: b64(SALT), iterations: ITER}, base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
}

async function load(l){
  if (cache[l]) return cache[l];
  const res = await fetch(l + ".enc.json", {cache: "no-cache"});
  if (!res.ok) throw new Error("net");
  const {iv, ct} = await res.json();
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(iv)}, key, b64(ct)); // throws on a wrong key
  return cache[l] = JSON.parse(new TextDecoder().decode(plain));
}

async function show(){
  const doc = await load(lang);
  document.title = doc.title;
  $("content").innerHTML = doc.html;
  $("login").hidden = true; $("content").hidden = false; $("logout").hidden = false;
  if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
}

$("login").addEventListener("submit", async e => {
  e.preventDefault();
  const t = T[lang];
  $("err").textContent = ""; $("go").disabled = true; $("go").textContent = t.wait;
  try {
    key = await derive($("user").value.trim(), $("pass").value);
    await show();
    const raw = await crypto.subtle.exportKey("raw", key);
    store.set(btoa(String.fromCharCode(...new Uint8Array(raw))), $("remember").checked);
    $("pass").value = "";
  } catch (err) {
    key = null;
    $("err").textContent = err.message === "net" ? t.net : t.bad;
  } finally {
    $("go").disabled = false; $("go").textContent = t.go;
  }
});

for (const l of ["ru", "en"]) $("lang-" + l).addEventListener("click", async () => {
  if (l === lang) return;
  lang = l;
  try { localStorage.setItem("kenyaesg-lang", l); } catch {}
  labels();
  if (key) { try { await show(); scrollTo(0, 0); } catch { $("err").textContent = T[lang].net; } }
});

$("logout").addEventListener("click", () => {
  store.clear(); key = null;
  for (const k in cache) delete cache[k];
  $("content").innerHTML = ""; $("content").hidden = true; $("logout").hidden = true; $("login").hidden = false;
  document.title = "KenyaESG Guide";
});

labels();
(async () => {
  const saved = store.get();
  if (!saved) return;
  try {
    key = await crypto.subtle.importKey("raw", b64(saved), {name: "AES-GCM"}, true, ["decrypt"]);
    await show();
  } catch { key = null; store.clear(); }
})();
</script>
</body>
</html>
