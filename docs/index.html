<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>KenyaESG Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Layout: long-read column with a sticky contents rail on wide screens; field-notebook feel, ledger tables */
:root{
  --bg:#F5F6F3; --surface:#FFFFFF; --fg:#1A211D; --muted:#5B655F; --line:#D9DED8;
  --accent:#0E6B4A; --accent-soft:#E2EFE8; --ok:#1F7A4D; --mid:#9A6A12; --mid-soft:#F6ECD6; --q:#A33A2A; --q-soft:#F6E1DC;
  --f-display:"PT Serif",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1A221E; --fg:#E6EBE7; --muted:#9AA69F; --line:#2E3933;
  --accent:#5CC796; --accent-soft:#1D3328; --ok:#5CC796; --mid:#E0B456; --mid-soft:#3A2F17; --q:#F08A78; --q-soft:#3D221D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1A221E; --fg:#E6EBE7; --muted:#9AA69F; --line:#2E3933;
  --accent:#5CC796; --accent-soft:#1D3328; --ok:#5CC796; --mid:#E0B456; --mid-soft:#3A2F17; --q:#F08A78; --q-soft:#3D221D; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.65 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:56px}
header.hero{max-width:1180px;margin:0 auto;padding-block:48px 28px;border-bottom:1px solid var(--line);margin-bottom:32px}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font:700 clamp(30px,5vw,48px)/1.1 var(--f-display);margin:14px 0 12px;text-wrap:balance;max-width:22ch}
.lede{color:var(--muted);max-width:68ch;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:20px;font-size:13px;color:var(--muted)}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;font-size:13.5px;max-height:calc(100vh - 40px);overflow:auto}
nav.toc .eyebrow{display:block;margin-bottom:12px}
nav.toc ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
nav.toc ul ul{display:none}
nav.toc a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-left:2px solid var(--line);line-height:1.35}
nav.toc a:hover,nav.toc a:focus-visible{color:var(--fg);border-left-color:var(--accent);outline:none}
main{min-width:0;max-width:760px;overflow-wrap:break-word}
main h2{font:700 28px/1.2 var(--f-display);margin:56px 0 16px;padding-top:20px;border-top:1px solid var(--line);text-wrap:balance}
main h2:first-child{margin-top:0;border-top:0;padding-top:0}
main h3{font:600 18px/1.35 var(--f-body);margin:32px 0 10px;text-wrap:balance}
main p,main li{max-width:68ch}
main ul,main ol{padding-left:1.3em}
main li{margin:4px 0}
main strong{font-weight:600}
main a{color:var(--accent);overflow-wrap:anywhere}
main hr{display:none}
blockquote{margin:20px 0;padding:16px 20px;background:var(--accent-soft);border-radius:6px}
blockquote p{margin:4px 0}
.tw{overflow-x:auto;margin:18px 0;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
th{font:500 11.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;min-width:140px}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:500}
.b{display:inline-block;font-size:.8em;line-height:1;padding:3px 5px;border-radius:4px;vertical-align:1px}
.b-ok{background:var(--accent-soft)} .b-mid{background:var(--mid-soft)} .b-q{background:var(--q-soft)}
pre.mermaid{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;overflow-x:auto;font:13px/1.4 var(--f-mono)}
code{font-family:var(--f-mono);font-size:.9em}
.quick + ol{counter-reset:k;list-style:none;padding:0;display:grid;gap:12px}
.quick + ol li{counter-increment:k;position:relative;padding:14px 16px 14px 52px;background:var(--surface);border:1px solid var(--line);border-radius:6px;max-width:none}
.quick + ol li::before{content:counter(k);position:absolute;left:16px;top:12px;font:700 22px/1 var(--f-display);color:var(--accent)}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr);gap:0} nav.toc{position:static;max-height:none;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--line)} header.hero{padding-block:28px 20px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
/* site chrome: top bar, login */
.bar{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:16px 0;font:500 13px/1 var(--f-mono)}
.brand{color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.bar .tools{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button,.btn-ghost{font:inherit;background:var(--surface);color:var(--muted);border:0;padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.btn-ghost{border:1px solid var(--line);border-radius:6px}
.seg button:focus-visible,.btn-ghost:focus-visible,.login input:focus-visible,.login button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.login{max-width:400px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px;display:grid;gap:14px}
.login h1{font-size:28px;margin:0;max-width:none}
.login p{margin:0;color:var(--muted)}
.login label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.login input{font:16px var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.login button[type=submit]{font:600 15px var(--f-body);padding:11px;border:0;border-radius:6px;background:var(--accent);color:var(--bg);cursor:pointer}
.login button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--q);font-size:14px;min-height:1.2em}
.remember{display:flex!important;grid-template-columns:none;align-items:center;gap:8px!important}
.remember input{width:auto}
.pmap{display:grid;gap:8px;margin:18px 0}
.pm-row{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pm-row>span{padding:10px 12px;font-size:14px;line-height:1.4;position:relative}
.pm-row>span+span{border-left:1px solid var(--line)}
.pm-row>span+span::before{content:"→";position:absolute;left:-9px;top:50%;transform:translateY(-50%);background:var(--surface);color:var(--accent);font-weight:600;line-height:1}
.pm-src{font-weight:600}
.pm-head{background:transparent;border:0}
.pm-head>span{font:500 11.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-block:0}
.pm-head>span+span{border-left:0}
.pm-head>span+span::before{content:none}
@media (max-width:560px){.pm-row{grid-template-columns:1fr}.pm-row>span+span{border-left:0;border-top:1px solid var(--line)}.pm-row>span+span::before{left:12px;top:-9px;transform:none;content:"↓"}.pm-head{display:none}}

</style>
</head>
<body>
<div class="bar">
  <span class="brand">KenyaESG</span>
  <span class="tools">
    <span class="seg" role="group" aria-label="Language">
      <button type="button" id="lang-ru" data-lang="ru">RU</button>
      <button type="button" id="lang-en" data-lang="en">EN</button>
    </span>
    <button type="button" class="btn-ghost" id="logout" hidden></button>
  </span>
</div>

<form class="login" id="login" autocomplete="on">
  <h1 id="l-title"></h1>
  <p id="l-sub"></p>
  <label><span id="l-user"></span><input id="user" name="username" autocomplete="username" required></label>
  <label><span id="l-pass"></span><input id="pass" name="password" type="password" autocomplete="current-password" required></label>
  <label class="remember"><input id="remember" type="checkbox"><span id="l-remember"></span></label>
  <button type="submit" id="go"></button>
  <div class="err" id="err" role="alert"></div>
</form>

<div id="content" hidden></div>

<script>
const SALT = "muFm0ffoZ3UqRhPby9+3ZA==", ITER = 600000, KEY_SLOT = "kenyaesg-key";
const T = {
  ru: {title: "Путеводитель KenyaESG", sub: "Закрытый справочник по ESG и углеродному учёту в Кении. Войдите, чтобы открыть.",
       user: "Пользователь", pass: "Пароль", remember: "Запомнить на этом устройстве", go: "Войти", wait: "Проверяю…",
       bad: "Неверный пользователь или пароль.", net: "Не удалось загрузить текст. Обновите страницу.", out: "Выйти"},
  en: {title: "KenyaESG Guide", sub: "A private guide to ESG and carbon accounting in Kenya. Sign in to open it.",
       user: "Username", pass: "Password", remember: "Remember on this device", go: "Sign in", wait: "Checking…",
       bad: "Wrong username or password.", net: "Could not load the text. Reload the page.", out: "Sign out"}
};
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const store = {
  get(){ try { return localStorage.getItem(KEY_SLOT) || sessionStorage.getItem(KEY_SLOT); } catch { return null; } },
  set(v, keep){ try { (keep ? localStorage : sessionStorage).setItem(KEY_SLOT, v); } catch {} },
  clear(){ try { localStorage.removeItem(KEY_SLOT); sessionStorage.removeItem(KEY_SLOT); } catch {} }
};
let lang = (() => { try { const q = new URLSearchParams(location.search).get("lang"); return q || localStorage.getItem("kenyaesg-lang") || ((navigator.language || "").startsWith("ru") ? "ru" : "en"); } catch { return "ru"; } })();
if (!T[lang]) lang = "ru";
let key = null;
const cache = {};

function labels(){
  const t = T[lang];
  document.documentElement.lang = lang;
  $("l-title").textContent = t.title; $("l-sub").textContent = t.sub;
  $("l-user").textContent = t.user; $("l-pass").textContent = t.pass;
  $("l-remember").textContent = t.remember; $("go").textContent = t.go; $("logout").textContent = t.out;
  for (const l of ["ru", "en"]) $("lang-" + l).setAttribute("aria-pressed", String(l === lang));
}

async function derive(user, pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(user + "\n" + pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: b64(SALT), iterations: ITER}, base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
}

async function load(l){
  if (cache[l]) return cache[l];
  const res = await fetch(l + ".enc.json", {cache: "no-cache"});
  if (!res.ok) throw new Error("net");
  const {iv, ct} = await res.json();
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(iv)}, key, b64(ct)); // throws on a wrong key
  return cache[l] = JSON.parse(new TextDecoder().decode(plain));
}

async function show(){
  const doc = await load(lang);
  document.title = doc.title;
  $("content").innerHTML = doc.html;
  $("login").hidden = true; $("content").hidden = false; $("logout").hidden = false;
  if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
}

$("login").addEventListener("submit", async e => {
  e.preventDefault();
  const t = T[lang];
  $("err").textContent = ""; $("go").disabled = true; $("go").textContent = t.wait;
  try {
    key = await derive($("user").value.trim(), $("pass").value);
    await show();
    const raw = await crypto.subtle.exportKey("raw", key);
    store.set(btoa(String.fromCharCode(...new Uint8Array(raw))), $("remember").checked);
    $("pass").value = "";
  } catch (err) {
    key = null;
    $("err").textContent = err.message === "net" ? t.net : t.bad;
  } finally {
    $("go").disabled = false; $("go").textContent = t.go;
  }
});

for (const l of ["ru", "en"]) $("lang-" + l).addEventListener("click", async () => {
  if (l === lang) return;
  lang = l;
  try { localStorage.setItem("kenyaesg-lang", l); } catch {}
  labels();
  if (key) { try { await show(); scrollTo(0, 0); } catch { $("err").textContent = T[lang].net; } }
});

$("logout").addEventListener("click", () => {
  store.clear(); key = null;
  for (const k in cache) delete cache[k];
  $("content").innerHTML = ""; $("content").hidden = true; $("logout").hidden = true; $("login").hidden = false;
  document.title = "KenyaESG Guide";
});

labels();
(async () => {
  const saved = store.get();
  if (!saved) return;
  try {
    key = await crypto.subtle.importKey("raw", b64(saved), {name: "AES-GCM"}, true, ["decrypt"]);
    await show();
  } catch { key = null; store.clear(); }
})();
</script>
</body>
</html>
